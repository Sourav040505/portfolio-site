<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#080810"/>
      <stop offset="100%" style="stop-color:#13131f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- grid -->
  <g opacity="0.06" stroke="#6366f1" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/><line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/><line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/><line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/><line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>
  <!-- accent line -->
  <rect x="80" y="280" width="60" height="3" fill="url(#accent)"/>
  <!-- name -->
  <text x="80" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="900" fill="#f1f1f3">Sourav<tspan fill="#6366f1">.</tspan></text>
  <!-- tagline -->
  <text x="80" y="330" font-family="system-ui, sans-serif" font-size="28" fill="#9ca3af">Backend SDE · AI · C++ &amp; DSA</text>
  <text x="80" y="380" font-family="monospace" font-size="18" fill="#6b7280" letter-spacing="3">OPEN TO REMOTE INTERNSHIPS &amp; FREELANCE</text>
  <!-- diamond mark -->
  <rect x="1020" y="240" width="40" height="40" fill="none" stroke="#6366f1" stroke-width="2" transform="rotate(45 1040 260)"/>
  <rect x="1034" y="254" width="12" height="12" fill="#6366f1" transform="rotate(45 1040 260)"/>
</svg>
